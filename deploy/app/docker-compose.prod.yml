name: ai-bioworkflow

services:
  proxy:
    image: ${AI_BIOWORKFLOW_CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    environment:
      AI_BIOWORKFLOW_SITE_ADDRESS: ${AI_BIOWORKFLOW_SITE_ADDRESS:?Set AI_BIOWORKFLOW_SITE_ADDRESS in .env.deploy}
      AI_BIOWORKFLOW_TLS_EMAIL: ${AI_BIOWORKFLOW_TLS_EMAIL:?Set AI_BIOWORKFLOW_TLS_EMAIL in .env.deploy}
    ports:
      - "${AI_BIOWORKFLOW_HTTP_BIND:-0.0.0.0}:${AI_BIOWORKFLOW_HTTP_PORT:-80}:80"
      - "${AI_BIOWORKFLOW_HTTPS_BIND:-0.0.0.0}:${AI_BIOWORKFLOW_HTTPS_PORT:-443}:443"
      - "${AI_BIOWORKFLOW_HTTPS_BIND:-0.0.0.0}:${AI_BIOWORKFLOW_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  api:
    image: ${AI_BIOWORKFLOW_API_IMAGE:?Set AI_BIOWORKFLOW_API_IMAGE in .env.images}
    restart: unless-stopped
    env_file:
      - ${AI_BIOWORKFLOW_RUNTIME_ENV_FILE:-./.env.prod}
    expose:
      - "8010"
    volumes:
      - api_data:/data/ai-bioworkflow

  web:
    image: ${AI_BIOWORKFLOW_WEB_IMAGE:?Set AI_BIOWORKFLOW_WEB_IMAGE in .env.images}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"

volumes:
  api_data:
  caddy_data:
  caddy_config:
