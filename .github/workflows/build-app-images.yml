name: Build app images

on:
  push:
    branches:
      - main
    paths:
      - ".dockerignore"
      - ".github/workflows/build-app-images.yml"
      - "deploy/app/**"
      - "main.py"
      - "pyproject.toml"
      - "src/**"
      - "uv.lock"
      - "web/**"
  pull_request:
    branches:
      - main
    paths:
      - ".dockerignore"
      - ".github/workflows/build-app-images.yml"
      - "deploy/app/**"
      - "main.py"
      - "pyproject.toml"
      - "src/**"
      - "uv.lock"
      - "web/**"
  workflow_dispatch:
    inputs:
      publish:
        description: "Push images to ACR after the build"
        required: true
        default: false
        type: boolean
      image_tag:
        description: "Optional image tag override. Defaults to the short commit SHA."
        required: false
        default: ""
        type: string
      next_public_api_base_url:
        description: "Browser-visible API base URL compiled into the web image."
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  API_IMAGE_NAME: ai-bioworkflow-api
  WEB_IMAGE_NAME: ai-bioworkflow-web
  FALLBACK_NEXT_PUBLIC_API_BASE_URL: http://localhost:8010

jobs:
  build:
    name: Build app images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare image metadata
        id: meta
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          DISPATCH_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
          DISPATCH_PUBLISH: ${{ github.event.inputs.publish }}
          DISPATCH_NEXT_PUBLIC_API_BASE_URL: ${{ github.event.inputs.next_public_api_base_url }}
          REPO_NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA::12}"
          image_tag="${DISPATCH_IMAGE_TAG:-$short_sha}"
          next_public_api_base_url="${DISPATCH_NEXT_PUBLIC_API_BASE_URL:-${REPO_NEXT_PUBLIC_API_BASE_URL:-$FALLBACK_NEXT_PUBLIC_API_BASE_URL}}"

          if ! [[ "$image_tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::image_tag must be a valid Docker tag using letters, numbers, '_', '.', and '-'"
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$DISPATCH_PUBLISH" == "true" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::publish=true is only allowed from refs/heads/main"
            exit 1
          fi

          publish="false"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            publish="true"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$DISPATCH_PUBLISH" == "true" ]]; then
            publish="true"
          fi

          if [[ -n "$ACR_REGISTRY" && -n "$ACR_NAMESPACE" ]]; then
            api_image="${ACR_REGISTRY}/${ACR_NAMESPACE}/${API_IMAGE_NAME}"
            web_image="${ACR_REGISTRY}/${ACR_NAMESPACE}/${WEB_IMAGE_NAME}"
          else
            api_image="${API_IMAGE_NAME}"
            web_image="${WEB_IMAGE_NAME}"
          fi

          {
            echo "image_tag=$image_tag"
            echo "next_public_api_base_url=$next_public_api_base_url"
            echo "publish=$publish"
            echo "api_image=$api_image"
            echo "web_image=$web_image"
          } >> "$GITHUB_OUTPUT"

      - name: Validate ACR configuration
        if: ${{ steps.meta.outputs.publish == 'true' }}
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail

          for name in ACR_REGISTRY ACR_NAMESPACE ACR_USERNAME ACR_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required secret: ${name}"
              exit 1
            fi
          done

      - name: Log in to Alibaba Cloud ACR
        if: ${{ steps.meta.outputs.publish == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build API image
        run: |
          set -euo pipefail

          docker build \
            -f deploy/app/api/Dockerfile \
            -t "${{ steps.meta.outputs.api_image }}:${{ steps.meta.outputs.image_tag }}" \
            .

      - name: Build Web image
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ steps.meta.outputs.next_public_api_base_url }}
        run: |
          set -euo pipefail

          docker build \
            -f deploy/app/web/Dockerfile \
            -t "${{ steps.meta.outputs.web_image }}:${{ steps.meta.outputs.image_tag }}" \
            --build-arg "NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}" \
            .

      - name: Push images
        if: ${{ steps.meta.outputs.publish == 'true' }}
        run: |
          set -euo pipefail

          api_image="${{ steps.meta.outputs.api_image }}"
          web_image="${{ steps.meta.outputs.web_image }}"
          image_tag="${{ steps.meta.outputs.image_tag }}"

          docker tag "${api_image}:${image_tag}" "${api_image}:latest"
          docker tag "${web_image}:${image_tag}" "${web_image}:latest"

          docker push "${api_image}:${image_tag}"
          docker push "${api_image}:latest"
          docker push "${web_image}:${image_tag}"
          docker push "${web_image}:latest"

      - name: Write build summary
        run: |
          set -euo pipefail

          {
            echo "## App image build"
            echo ""
            echo "- API image: \`${{ steps.meta.outputs.api_image }}:${{ steps.meta.outputs.image_tag }}\`"
            echo "- Web image: \`${{ steps.meta.outputs.web_image }}:${{ steps.meta.outputs.image_tag }}\`"
            echo "- Web API base URL: \`${{ steps.meta.outputs.next_public_api_base_url }}\`"
            echo "- Published to ACR: \`${{ steps.meta.outputs.publish }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy app to ECS
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.publish == 'true' }}
    concurrency:
      group: ecs-app-deploy-${{ github.repository }}
      cancel-in-progress: false
    env:
      ECS_DEPLOY_PATH: ${{ vars.ECS_DEPLOY_PATH }}
      ECS_HOST: ${{ secrets.ECS_HOST }}
      ECS_KNOWN_HOSTS: ${{ secrets.ECS_KNOWN_HOSTS }}
      ECS_SSH_PORT: ${{ secrets.ECS_SSH_PORT }}
      ECS_SSH_PRIVATE_KEY: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
      ECS_USER: ${{ secrets.ECS_USER }}
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate ECS deployment configuration
        run: |
          set -euo pipefail

          for name in ECS_HOST ECS_USER ECS_SSH_PRIVATE_KEY ACR_REGISTRY ACR_NAMESPACE IMAGE_TAG; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required deployment value: ${name}"
              exit 1
            fi
          done

          deploy_path="${ECS_DEPLOY_PATH:-/opt/ai-bioworkflow}"
          if ! [[ "$deploy_path" =~ ^/[A-Za-z0-9._/-]+$ ]] || [[ "$deploy_path" == *"/../"* || "$deploy_path" == */.. || "$deploy_path" == *"/./"* || "$deploy_path" == */. ]]; then
            echo "::error::ECS_DEPLOY_PATH must be an absolute path using only letters, numbers, '/', '.', '_' and '-' without '.' or '..' path segments"
            exit 1
          fi

          ssh_port="${ECS_SSH_PORT:-22}"
          if ! [[ "$ssh_port" =~ ^[0-9]{1,5}$ ]] || (( 10#$ssh_port < 1 || 10#$ssh_port > 65535 )); then
            echo "::error::ECS_SSH_PORT must be an integer between 1 and 65535"
            exit 1
          fi

          if ! [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::IMAGE_TAG must be a valid Docker tag using letters, numbers, '_', '.', and '-'"
            exit 1
          fi

          if ! [[ "$ACR_REGISTRY" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]; then
            echo "::error::ACR_REGISTRY must be a registry host without a scheme or path"
            exit 1
          fi

          if ! [[ "$ACR_NAMESPACE" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::ACR_NAMESPACE must be a single registry namespace segment"
            exit 1
          fi

      - name: Prepare deploy image references
        run: |
          set -euo pipefail

          api_image="${ACR_REGISTRY}/${ACR_NAMESPACE}/${API_IMAGE_NAME}:${IMAGE_TAG}"
          web_image="${ACR_REGISTRY}/${ACR_NAMESPACE}/${WEB_IMAGE_NAME}:${IMAGE_TAG}"

          for image_ref in "$api_image" "$web_image"; do
            if ! [[ "$image_ref" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]+/[A-Za-z0-9._/-]+:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "::error::Invalid deploy image reference"
              exit 1
            fi
          done

          {
            echo "AI_BIOWORKFLOW_API_IMAGE=$api_image"
            echo "AI_BIOWORKFLOW_WEB_IMAGE=$web_image"
          } >> "$GITHUB_ENV"

      - name: Configure SSH
        run: |
          set -euo pipefail

          ssh_port="${ECS_SSH_PORT:-22}"
          known_hosts_path="$HOME/.ssh/known_hosts"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$ECS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          : > "$known_hosts_path"
          chmod 600 "$known_hosts_path"
          if [[ -n "${ECS_KNOWN_HOSTS:-}" ]]; then
            printf '%s\n' "$ECS_KNOWN_HOSTS" > "$known_hosts_path"
          else
            ssh-keyscan -T 10 -p "$ssh_port" -H "$ECS_HOST" > "$known_hosts_path" || true
          fi
          if [[ ! -s "$known_hosts_path" ]]; then
            echo "::error::known_hosts is empty; set ECS_KNOWN_HOSTS or verify ECS_HOST/ECS_SSH_PORT"
            exit 1
          fi
          chmod 600 "$known_hosts_path"

      - name: Sync deployment files
        run: |
          set -euo pipefail

          ssh_port="${ECS_SSH_PORT:-22}"
          deploy_path="${ECS_DEPLOY_PATH:-/opt/ai-bioworkflow}"
          ssh_common_opts=(
            -i "$HOME/.ssh/id_ed25519"
            -o BatchMode=yes
            -o ConnectTimeout=10
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=2
            -o StrictHostKeyChecking=yes
          )
          ssh_opts=("${ssh_common_opts[@]}" -p "$ssh_port")
          scp_opts=("${ssh_common_opts[@]}" -P "$ssh_port")

          ssh "${ssh_opts[@]}" "${ECS_USER}@${ECS_HOST}" "mkdir -p '${deploy_path}/scripts'"
          scp "${scp_opts[@]}" deploy/app/docker-compose.prod.yml deploy/app/Caddyfile "${ECS_USER}@${ECS_HOST}:${deploy_path}/"
          scp "${scp_opts[@]}" deploy/app/scripts/deploy-ecs.sh "${ECS_USER}@${ECS_HOST}:${deploy_path}/scripts/deploy-ecs.sh"
          ssh "${ssh_opts[@]}" "${ECS_USER}@${ECS_HOST}" "chmod +x '${deploy_path}/scripts/deploy-ecs.sh'"

      - name: Run ECS deployment
        run: |
          set -euo pipefail

          ssh_port="${ECS_SSH_PORT:-22}"
          deploy_path="${ECS_DEPLOY_PATH:-/opt/ai-bioworkflow}"
          ssh_opts=(
            -i "$HOME/.ssh/id_ed25519"
            -p "$ssh_port"
            -o BatchMode=yes
            -o ConnectTimeout=10
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=2
            -o StrictHostKeyChecking=yes
          )

          ssh "${ssh_opts[@]}" "${ECS_USER}@${ECS_HOST}" \
            bash -s -- "$deploy_path" "$AI_BIOWORKFLOW_API_IMAGE" "$AI_BIOWORKFLOW_WEB_IMAGE" <<'REMOTE_DEPLOY'
          set -euo pipefail

          deploy_path="$1"
          api_image="$2"
          web_image="$3"

          cd "$deploy_path"
          AI_BIOWORKFLOW_API_IMAGE="$api_image" \
            AI_BIOWORKFLOW_WEB_IMAGE="$web_image" \
            ./scripts/deploy-ecs.sh
          REMOTE_DEPLOY

      - name: Write deploy summary
        if: ${{ always() }}
        run: |
          set -euo pipefail

          {
            echo "## ECS app deploy"
            echo ""
            echo "- API image: \`${AI_BIOWORKFLOW_API_IMAGE:-not prepared}\`"
            echo "- Web image: \`${AI_BIOWORKFLOW_WEB_IMAGE:-not prepared}\`"
            echo "- Deploy path: \`${ECS_DEPLOY_PATH:-/opt/ai-bioworkflow}\`"
          } >> "$GITHUB_STEP_SUMMARY"
