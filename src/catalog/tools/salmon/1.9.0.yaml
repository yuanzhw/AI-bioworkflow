id: salmon
version: "1.9.0"
aliases:
  - transcript quantification
  - RNA-seq quantification
description: Transcript-level quantification for RNA-seq reads.

inputs:
  r1:
    type: File
    required: true
    description: First cleaned FASTQ read file.
  r2:
    type: File
    required: true
    description: Second cleaned FASTQ read file.
  index:
    type: File
    required: true
    description: Salmon transcriptome index.

params:
  lib_type:
    type: String
    default: A
    description: Library type passed to Salmon quant. A enables automatic inference.
  thread:
    type: Int
    default: 8
    min: 1

outputs:
  quant_file:
    type: File
    value: '"salmon_quant/quant.sf"'
  log_file:
    type: File
    value: '"salmon_quant/logs/salmon_quant.log"'
    tags:
      - multiqc_input

command_template: |
  salmon quant
  -l ~{lib_type}
  -i ~{index}
  -1 ~{r1}
  -2 ~{r2}
  -p ~{thread}
  -o salmon_quant

runtime:
  docker: quay.io/biocontainers/salmon:1.9.0--h7e5ed60_0
  cpu: 8
  memory: 16G
